<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anmeldung — Process Analyzer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2358a6ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='5' cy='6' r='3'/><circle cx='19' cy='18' r='3'/><path d='M8 6h6a3 3 0 0 1 3 3v6'/></svg>">
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="js/login.js"></script>
</head>
<body class="login-body">
  <main class="login-card">
    <h1><span class="brand-accent">Process</span>Analyzer</h1>
    <p class="login-hint">
      Diese Auswertung zeigt, wer welche Vorgänge bearbeitet und entscheidet. Deshalb steht ein Kennwort davor.
    </p>
    <form id="loginForm" autocomplete="off">
      <label class="login-label" for="password">Kennwort</label>
      <input class="login-input" type="password" id="password" name="password" required autofocus />
      <button class="btn-primary login-submit" type="submit">Anmelden</button>
      <p class="login-error" id="loginError" hidden></p>
    </form>
  </main>
</body>
</html>
