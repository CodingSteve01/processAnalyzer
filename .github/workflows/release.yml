name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Ensure only one release runs at a time; last push always completes
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Semantic Release
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: cycjimmy/semantic-release-action@v4
        id: semantic
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker Build & Push
    needs: release
    # Only build/push an image when semantic-release actually cut a version. Otherwise
    # (chore/docs/ci/refactor commits) there is no version and VERSION would fall back to
    # the git SHA, which dotnet rejects as an invalid version string — failing the job.
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          # Derived from the owner, never written down. The repository moved organisations once and the hard-coded
          # name kept pushing at the old namespace, where the token no longer has rights — a red release on a green
          # build, for a reason that has nothing to do with the code.
          images: ghcr.io/${{ github.repository_owner }}/processanalyzer
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=raw,value=v${{ needs.release.outputs.new_release_version }},enable=${{ needs.release.outputs.new_release_published == 'true' }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ProcessAnalyzer.Web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release.outputs.new_release_published == 'true' && needs.release.outputs.new_release_version || github.sha }}

  miner:
    name: Docker Build & Push (Miner)
    needs: release
    # The miner is released with the same version as the application on purpose: the two exchange an OCEL file whose
    # shape they have to agree on, and two independently versioned images make "which miner goes with which export"
    # a question somebody has to answer under pressure.
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/processanalyzer-miner
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=raw,value=v${{ needs.release.outputs.new_release_version }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./miner
          # amd64 only. pm4py pulls scipy and numpy, and building those for arm64 under emulation takes tens of
          # minutes for an image that runs on a server. Add arm64 when something actually needs it.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
